[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Kenji Lau"]
edition = "2024"
homepage = "https://github.com/roushou/vvv"
license = "MIT"
readme = "README.md"
repository = "https://github.com/roushou/vvv"
rust-version = "1.90"

[workspace.dependencies]
vvv-core = { version = "0.1.0", path = "crates/vvv-core" }
vvv-engine = { version = "0.1.0", path = "crates/vvv-engine" }
vvv-lang = { version = "0.1.0", path = "crates/vvv-lang" }
vvv-tui = { version = "0.1.0", path = "crates/vvv-tui" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

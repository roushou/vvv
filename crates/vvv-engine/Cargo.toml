[package]
name = "vvv-engine"
version.workspace = true
authors.workspace = true
categories = ["development-tools", "text-processing"]
documentation = "https://docs.rs/vvv-engine"
edition.workspace = true
homepage.workspace = true
keywords = ["refactoring", "codemod", "ast", "search", "syntax"]
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Composes vvv plugins into refactoring pipelines"

[features]
schema = ["dep:schemars", "vvv-core/schema"]

[dependencies]
blake3 = "1.8.7"
ignore = "0.4.33"
rayon = "1.10"
same-file = "1.0.6"
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = "3.2.0"
thiserror = { workspace = true }
vvv-core = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"

[dev-dependencies]
insta = "1.48.0"
jsonschema = { workspace = true }

[lints]
workspace = true

[[example]]
name = "schemas"
required-features = ["schema"]

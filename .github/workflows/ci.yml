name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository. Without this the token keeps the
# repository default, which is broader than CI needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  dprint:
    name: dprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dprint/check@v2
        with:
          dprint-version: 0.56.1
          cache: true

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--no-fail-fast` runs every test target even after one fails, so a red run
      # reports all failures at once rather than the first target's.
      - run: cargo test --workspace --all-features --no-fail-fast
      - run: cargo test -p vvv-core -p vvv-engine --no-default-features
        if: runner.os == 'Windows'
      - run: cargo clippy -p vvv-engine --all-targets --all-features
        if: runner.os == 'Windows'

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every language must build and test in isolation and the CLI must build with none.
      - run: cargo build -p vvv-rs --no-default-features
      - run: cargo build -p vvv-rs --no-default-features --features rust
      - run: cargo build -p vvv-rs --no-default-features --features typescript
      - run: cargo test -p vvv-lang --no-default-features --features rust
      - run: cargo test -p vvv-lang --no-default-features --features typescript
      - run: cargo test -p vvv-core -p vvv-engine --no-default-features
      - run: cargo test -p vvv-engine --no-default-features --features schema --test schema
      - run: cargo build -p vvv-rs --no-default-features --features schemas
      - run: cargo build -p vvv-rs --no-default-features --features rust,schemas
      - run: cargo build -p vvv-rs --no-default-features --features typescript,schemas
      # The declared MSRV must hold for the heaviest optional dependency tree:
      # `mcp` pulls rmcp and tokio. Spelled as an explicit `+1.90.0` so the check
      # cannot be satisfied by the stable toolchain installed above.
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo +1.90.0 check -p vvv-rs --no-default-features --features mcp --locked

  mcp:
    name: MCP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The MCP surface answers per registered language, so each combination needs
      # its own compile. Windows needs no cell of its own: `test (windows-latest)`
      # runs this same `--test mcp` target under `--all-features`.
      - run: cargo test -p vvv-rs --no-default-features --features mcp --test mcp
      - run: cargo test -p vvv-rs --no-default-features --features mcp,rust --test mcp
      - run: cargo test -p vvv-rs --no-default-features --features mcp,typescript --test mcp

  release-targets:
    name: release target (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none
        if: startsWith(matrix.os, 'ubuntu')
      - run: cargo check -p vvv-rs --features mcp --locked --target ${{ matrix.target }}

  schemas:
    name: published schemas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p vvv-engine --features schema --example schemas

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
